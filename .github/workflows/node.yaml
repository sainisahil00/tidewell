name: CI/CD - Test, Build & Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Install packages & prepare server
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} 'bash -s' <<'EOF'
          set -e

          # Install nginx + rsync
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx rsync

          # Create web root owned by ubuntu
          sudo mkdir -p /var/www/tidewell
          sudo chown -R ubuntu:ubuntu /var/www/tidewell
          sudo chmod -R 755 /var/www/tidewell

          # Write nginx site config
          sudo tee /etc/nginx/sites-available/tidewell > /dev/null <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;
              root /var/www/tidewell;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX

          sudo ln -sf /etc/nginx/sites-available/tidewell /etc/nginx/sites-enabled/tidewell
          sudo rm -f /etc/nginx/sites-enabled/default

          # Make sure nginx starts on boot
          sudo systemctl enable nginx
          EOF

      - name: Copy files to EC2
        run: |
          rsync -avz --delete dist/ \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/tidewell/

      - name: Test config & restart nginx
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} \
            "sudo nginx -t && sudo systemctl restart nginx"

      - name: Smoke test
        run: |
          sleep 3
          curl --fail --silent --show-error --head http://${{ secrets.EC2_HOST }}/
